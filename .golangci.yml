version: "2"
linters:
  enable:
    - errorlint
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Unchecked Close in tests is fine: the test ends with it.
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
